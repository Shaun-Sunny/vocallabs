table:
  name: notification_log
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - workflow_run_id
        - channel
        - message
        - config
        - sent_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id

event_triggers:
  - name: notification_log_event_trigger
    definition:
      enable_manual: false
      insert:
        columns: '*'
    webhook: '{{NHOST_FUNCTIONS_URL}}/notify-handler'
    headers:
      - name: x-hasura-admin-secret
        value_from_env: NHOST_ADMIN_SECRET
      - name: x-notification-event
        value: notification
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
