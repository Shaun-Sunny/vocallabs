table:
  name: org_usage_stats
  schema: public
object_relationships:
  - name: organization
    using:
      manual_configuration:
        column_mapping:
          org_id: id
        insertion_order: null
        remote_table:
          name: organizations
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - org_name
        - quota_used
        - quota_limit
        - quota_usage_percent
        - avg_run_duration_seconds
        - runs_this_month
        - quota_period_start
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
