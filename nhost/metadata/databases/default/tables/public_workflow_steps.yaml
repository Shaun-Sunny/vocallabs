table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in: [owner, editor]
          # db_write and notify steps reach outside the sandbox — only an
          # owner may add them. Any other step_type just needs the
          # owner/editor check above.
          - _or:
              - step_type:
                  _nin: [db_write, notify]
              - workflow:
                  organization:
                    org_members:
                      _and:
                        - user_id:
                            _eq: X-Hasura-User-Id
                        - role:
                            _eq: owner
      columns:
        - workflow_id
        - name
        - step_type
        - position
        - config
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - name
        - step_type
        - position
        - config
        - created_at
        - updated_at
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - step_type
        - position
        - config
      filter:
        workflow:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in: [owner, editor]
      check:
        _or:
          - step_type:
              _nin: [db_write, notify]
          - workflow:
              organization:
                org_members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _eq: owner
delete_permissions:
  - role: user
    permission:
      filter:
        workflow:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in: [owner, editor]
